<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceff3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e141b" media="(prefers-color-scheme: dark)">
<meta name="description" content="6인제 배구 감독 노트: 포지션 폴트, 공수 대형, 교체 규칙 점검">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="벤치보드">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>6인제 벤치보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: 코트 그림이 주인공인 2단 작업대 — 왼쪽 코트, 오른쪽 판정 패널. 폰에서는 세로로 쌓임 */
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#15212e; --muted:#5a6879; --line:#d3dae2; --soft:#f3f5f8;
  --accent:#1d5aa6; --accent-ink:#ffffff;
  --floor:#e48b45; --floor-line:#fff8ef; --free:#2c5a86; --net:#0b1118;
  --front:#15212e; --front-ink:#ffffff; --back:#ffffff; --back-ink:#15212e; --libero:#f3c63f; --libero-ink:#15212e;
  --tok-name:#1a1208; --tok-halo:rgba(255,248,239,.75); --free-ink:#d9e6f2;
  --ok:#1b8a4c; --ok-bg:#e2f3e9; --warn:#a86f00; --warn-bg:#fcf0d4; --bad:#cf3326; --bad-bg:#fbe4e1;
  --display:'Black Han Sans','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#161f29; --ink:#e4e9ef; --muted:#97a4b3; --line:#2b3644; --soft:#1c2733;
  --accent:#6ea6ea; --accent-ink:#0e141b;
  --floor:#c06a2e; --floor-line:#f6e7d6; --free:#18324d; --net:#05080c;
  --front:#0b1118; --front-ink:#ffffff; --back:#f4f6f8; --back-ink:#15212e; --libero:#f3c63f; --libero-ink:#15212e;
  --tok-name:#140d05; --tok-halo:rgba(246,231,214,.7); --free-ink:#9fb6cc;
  --ok:#4cc27f; --ok-bg:#12301f; --warn:#e7ad3c; --warn-bg:#352a10; --bad:#ff6d60; --bad-bg:#3b1612;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#161f29; --ink:#e4e9ef; --muted:#97a4b3; --line:#2b3644; --soft:#1c2733;
  --accent:#6ea6ea; --accent-ink:#0e141b;
  --floor:#c06a2e; --floor-line:#f6e7d6; --free:#18324d; --net:#05080c;
  --front:#0b1118; --front-ink:#ffffff; --back:#f4f6f8; --back-ink:#15212e; --libero:#f3c63f; --libero-ink:#15212e;
  --tok-name:#140d05; --tok-halo:rgba(246,231,214,.7); --free-ink:#9fb6cc;
  --ok:#4cc27f; --ok-bg:#12301f; --warn:#e7ad3c; --warn-bg:#352a10; --bad:#ff6d60; --bad-bg:#3b1612;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:0 48px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.brand .six{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--floor);color:#fff;font-size:16px;transform:translateY(3px)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
nav.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
nav.tabs button:focus-visible,.btn:focus-visible,.pill:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.split{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:18px}
@media (min-width:880px){.split{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.courtcol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}}
.courtcol{min-width:0}
.court{width:100%;max-width:560px;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px}
.courtcap{max-width:560px;margin:8px auto 0;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center}
.legend{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.panel{min-width:0;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 .sub{font-weight:500;color:var(--muted);font-size:13px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px}

.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .tag{font-family:var(--mono);font-size:11px;opacity:.75;font-weight:500}
.pill .now{font-size:10.5px;background:var(--floor);color:#fff;border-radius:4px;padding:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.verdict{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;border:1px solid transparent}
.verdict .big{font-family:var(--display);font-size:22px;line-height:1.1}
.verdict .small{font-size:13px;opacity:.9}
.v-ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.v-warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.v-bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:currentColor}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;font-size:13.5px;padding:7px 10px;border-radius:8px;background:var(--soft)}
.checks li .st{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap;margin-top:2px}
.checks li .num{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;margin-top:1px}
.st.ok{background:var(--ok-bg);color:var(--ok)} .st.warn{background:var(--warn-bg);color:var(--warn)} .st.bad{background:var(--bad-bg);color:var(--bad)} .st.ex{background:var(--line);color:var(--muted)} .st.info{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--muted);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;background:transparent;font-weight:500}
.chip[aria-pressed="true"]{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:10px}
.team{background:var(--soft);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;position:relative;border:2px solid transparent}
.team.srv{border-color:var(--floor)}
.team .tname{font-size:13px;font-weight:700;color:var(--muted)}
.team .pts{font-family:var(--mono);font-weight:600;font-size:44px;line-height:1.05;font-variant-numeric:tabular-nums}
.team .srvtag{position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;color:var(--floor)}
.score .mid{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;color:var(--muted);text-align:center;gap:2px}
.score .mid b{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink)}
.ptbtns{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.ptbtns .btn{padding:12px 10px;font-size:15px}
.notice{border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.notice.info{background:color-mix(in srgb,var(--accent) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.notice.warn{background:var(--warn-bg);color:var(--warn)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}

.subgrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.subgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.subgrid .arrow{font-family:var(--mono);padding-bottom:9px;color:var(--muted)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
.counter{font-family:var(--mono);font-size:13px;padding:2px 8px;border-radius:6px;background:var(--soft)}
.counter.full{background:var(--bad-bg);color:var(--bad)}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--muted);white-space:nowrap}
.badge.L{background:var(--libero);color:var(--libero-ink)}
.stt{font-size:12.5px}
.stt.ok{color:var(--ok)} .stt.warn{color:var(--warn)} .stt.bad{color:var(--bad)} .stt.mut{color:var(--muted)}

.log{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:3px;max-height:220px;overflow:auto}
.log li{display:flex;gap:8px}
.log .sc{font-family:var(--mono);color:var(--muted);min-width:48px}

details.rules{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px}
details.rules summary{cursor:pointer;font-weight:700;font-size:14px}
details.rules ul{margin:8px 0 2px;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
details.rules p{font-size:12.5px;color:var(--muted);margin:8px 0 0}

/* roster */
.lineupgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--floor);padding:10px;border-radius:10px;position:relative}
.lineupgrid .netbar{grid-column:1/-1;height:6px;background:var(--net);border-radius:3px}
.lineupgrid .cell{background:color-mix(in srgb,var(--panel) 92%,transparent);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.lineupgrid .cell b{font-family:var(--mono);font-size:12px;color:var(--muted)}
.lineupgrid .cell.dup{outline:2px solid var(--bad)}
.lineupgrid .attline{grid-column:1/-1;border-top:2px dashed var(--floor-line);margin:2px 0}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.checkrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.checkrow label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.example{font-size:12.5px;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hide{display:none!important}

/* svg court */
.free{fill:var(--free)} .floor{fill:var(--floor)}
.lines rect,.lines line{stroke:var(--floor-line);stroke-width:.05;fill:none}
.lines .ext{stroke-dasharray:.15 .15}
.net{stroke:var(--net);stroke-width:.14;stroke-linecap:round}
.post{fill:var(--net)}
.clabel{fill:var(--free-ink);font-size:.3px;font-family:var(--body);font-weight:600;text-anchor:middle}
.zone{fill:var(--floor-line);opacity:.28;font-size:1.3px;font-family:var(--display);text-anchor:middle;dominant-baseline:central}
.tok circle.body{stroke-width:.04}
.tok.front circle.body{fill:var(--front);stroke:var(--front)}
.tok.front text.num{fill:var(--front-ink)}
.tok.back circle.body{fill:var(--back);stroke:var(--back-ink)}
.tok.back text.num{fill:var(--back-ink)}
.tok.lib circle.body{fill:var(--libero);stroke:var(--libero-ink)}
.tok.lib text.num{fill:var(--libero-ink)}
.tok text.num{font-family:var(--mono);font-weight:600;font-size:.4px;text-anchor:middle;dominant-baseline:central}
.tok text.nm{font-size:.28px;font-weight:700;text-anchor:middle;fill:var(--tok-name);stroke:var(--tok-halo);stroke-width:.09px;paint-order:stroke;font-family:var(--body)}
.tok circle.pb{fill:var(--panel);stroke:var(--ink);stroke-width:.03}
.tok text.pt{font-size:.22px;font-family:var(--mono);font-weight:600;text-anchor:middle;dominant-baseline:central;fill:var(--ink)}
.tok circle.ring{fill:none;stroke-width:.09;stroke:none}
.tok.bad circle.ring{stroke:var(--bad)}
.tok.caution circle.ring{stroke:var(--warn)}
.tok.hit circle.ring{stroke:var(--floor-line);stroke-dasharray:.12 .08}
svg[data-drag="1"] .tok{cursor:grab}
svg[data-drag="1"] .tok:active{cursor:grabbing}
.rel{stroke-width:.06;stroke-linecap:round}
.rel.ok{stroke:var(--ok);opacity:.85} .rel.caution{stroke:var(--warn)} .rel.bad{stroke:var(--bad);stroke-width:.1} .rel.ex{stroke:var(--free-ink);stroke-dasharray:.1 .1;opacity:.6}
.hole{fill:var(--bad);opacity:.28}
.ball{fill:#fff;stroke:var(--net);stroke-width:.04}
.balltxt{font-size:.26px;font-weight:700;fill:var(--free-ink);font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){.tok{transition:transform .25s ease}svg.dragging .tok{transition:none}}
</style>

<header class="top">
  <div class="topin">
    <div class="brand"><span class="six">6</span>벤치보드 <small>6인제 배구 감독 노트</small></div>
    <nav class="tabs" role="tablist" aria-label="화면">
      <button role="tab" data-act="tab" data-t="match" id="t-match">경기 · 교체</button>
      <button role="tab" data-act="tab" data-t="recv" id="t-recv">리시브 · 서브 대형</button>
      <button role="tab" data-act="tab" data-t="ad" id="t-ad">공격 · 수비 대형</button>
      <button role="tab" data-act="tab" data-t="roster" id="t-roster">선수단 · 라인업</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <section id="v-match" class="split">
    <div class="courtcol"><svg class="court" id="svgMatch" viewBox="-1.2 -0.9 11.4 12" aria-label="현재 코트 배치"></svg>
      <div class="courtcap" id="capMatch"></div></div>
    <div class="panel" id="pMatch"></div>
  </section>

  <section id="v-recv" class="split">
    <div class="courtcol"><svg class="court" id="svgRecv" viewBox="-1.2 -0.9 11.4 12" data-drag="1" aria-label="리시브 대형 코트. 선수를 끌어 위치를 바꿀 수 있습니다"></svg>
      <div class="courtcap"><span class="legend"><i style="background:var(--front)"></i>전위</span><span class="legend"><i style="background:var(--back)"></i>후위</span><span class="legend"><i style="background:var(--libero)"></i>리베로</span><span>작은 숫자 = 로테이션 자리 · 선수를 끌어 옮기세요</span></div></div>
    <div class="panel" id="pRecv"></div>
  </section>

  <section id="v-ad" class="split">
    <div class="courtcol"><svg class="court" id="svgAd" viewBox="-1.2 -0.9 11.4 12" data-drag="1" aria-label="공격 수비 대형 코트"></svg>
      <div class="courtcap"><span class="legend"><i style="background:var(--front)"></i>전위</span><span class="legend"><i style="background:var(--back)"></i>후위</span><span class="legend"><i style="background:var(--libero)"></i>리베로</span><span class="legend"><i style="background:var(--bad);opacity:.5;border:0;border-radius:2px"></i>2.5m 안에 수비수가 없는 빈 공간</span></div></div>
    <div class="panel" id="pAd"></div>
  </section>

  <section id="v-roster" style="margin-top:18px">
    <div class="panel" id="pRoster" style="max-width:860px;margin:0 auto"></div>
  </section>
</div>

<script>
(function(){
'use strict';
const ROLE={S:'세터',OH:'레프트',MB:'센터',OPP:'라이트',L:'리베로',DS:'수비전문'};
const PNAME={1:'후위 오른쪽',2:'전위 오른쪽',3:'전위 중앙',4:'전위 왼쪽',5:'후위 왼쪽',6:'후위 중앙'};
const isFront=p=>p===2||p===3||p===4;
const SPOT={4:[1.5,1.5],3:[4.5,1.5],2:[7.5,1.5],5:[1.5,6.3],6:[4.5,6.3],1:[7.5,6.3]};
const NAT={4:'LF',3:'MF',2:'RF',5:'LB',6:'CB',1:'RB'};
const SPOTNAME={LF:'전위 레프트',MF:'전위 센터',RF:'전위 라이트',LB:'후위 레프트',CB:'후위 센터',RB:'후위 라이트'};
const LS='vb-benchboard-v1';
let H=[];           // 되돌리기용 경기 상태 스냅샷
let drag=null;

function def(){
  return {v:1,example:true,
    players:[
      {id:'p1',num:3,name:'박서준',role:'S'},{id:'p2',num:7,name:'이도윤',role:'OH'},
      {id:'p3',num:12,name:'정시우',role:'MB'},{id:'p4',num:9,name:'윤주원',role:'OPP'},
      {id:'p5',num:10,name:'최하준',role:'OH'},{id:'p6',num:15,name:'강지호',role:'MB'},
      {id:'p7',num:1,name:'한예준',role:'L'},{id:'p8',num:5,name:'오건우',role:'DS'},

function perms(a){if(a.length<=1) return [a.slice()]; const out=[]; a.forEach((x,i)=>{for(const r of perms(a.slice(0,i).concat(a.slice(i+1)))) out.push([x,...r]);}); return out;}
const COLX={4:1.5,3:4.5,2:7.5,5:1.5,6:4.5,1:7.5};
const PAIR={5:4,6:3,1:2,4:5,3:6,2:1};
const ROWS=[[4,3,2],[5,6,1]];
const LANES={1:[[4.5,6]],2:[[2.6,6],[6.4,6]],3:[[1.5,5.9],[4.5,6.2],[7.5,5.9]],4:[[1.2,5.3],[3.4,6.7],[5.6,6.7],[7.8,5.3]],5:[[1.0,4.6],[2.8,6.8],[4.5,4.9],[6.2,6.8],[8.0,4.6]],6:[[1.0,4.4],[2.6,6.8],[4.0,4.6],[5.4,6.8],[6.8,4.6],[8.2,6.8]]};
function autoServe(){return {4:[1.5,0.9],3:[4.5,0.9],2:[7.5,0.9],5:[1.5,6.2],6:[4.5,6.6],1:[7.5,9.8]}}
function autoRecv(court,rset){
  const isR=p=>rset.has(court[p]);
  const rp=[1,2,3,4,5,6].filter(isR); const n=rp.length; const co={};
  if(n){
    const lanes=LANES[n]; let best=null,bc=1e9;
    for(const pm of perms(rp)){
      let c=0, okk=true;
      for(const row of ROWS){let last=-1; for(const p of row){const i=pm.indexOf(p); if(i<0) continue; if(i<last){okk=false;break} last=i;} if(!okk) break;}
      if(!okk) continue;
      pm.forEach((p,i)=>{c+=Math.abs(lanes[i][0]-COLX[p]); if(!isFront(p)) c+= (6-lanes[i][1])*0.15;});
      for(const [f,b] of VPAIRS){const i=pm.indexOf(f),j=pm.indexOf(b); if(i>=0&&j>=0&&lanes[i][1]>=lanes[j][1]) c+=0.8;}
      if(c<bc){bc=c;best=pm;}
    }
    if(!best) best=rp;
    best.forEach((p,i)=>{co[p]=[lanes[i][0],lanes[i][1]]});
  }
  function resolveRow(row,pref,yOf){
    for(let i=0;i<row.length;i++){const p=row[i]; if(co[p]) continue;
      let lo=0.3,hi=8.7;
      for(let j=0;j<i;j++) if(co[row[j]]) lo=Math.max(lo,co[row[j]][0]+0.7);
      for(let j=i+1;j<row.length;j++) if(co[row[j]]) hi=Math.min(hi,co[row[j]][0]-0.7);
      let x=Math.min(Math.max(pref(p),lo),hi); if(lo>hi) x=(lo+hi)/2;
      co[p]=[x,yOf(p)];
    }
  }
  resolveRow(ROWS[0],p=>COLX[p],()=>0.8);
  resolveRow(ROWS[1],p=>co[PAIR[p]][0],p=>{const f=PAIR[p]; return isR(f)?Math.min(8.6,co[f][1]+1.6):co[f][1]+1.0;});
  for(const [f,b] of VPAIRS){
    if(co[b][1]-co[f][1]<0.6){
      if(isR(b)&&isR(f)) co[f][1]=Math.max(0.6,co[b][1]-1.2);
      else if(!isR(b)) co[b][1]=Math.min(8.8,co[f][1]+0.8);
      if(co[b][1]-co[f][1]<0.6) co[f][1]=co[b][1]-0.8;
    }
  }
  for(const p in co) co[p]=[r1(co[p][0]),r1(co[p][1])];
  return co;
}

function libSwap(lid2){const c=cur(); if(!c.libero||libOutCheck().length) return; snap(); const lp=posOf(c.court,c.libero.lid);
  c.log.push({sc:`${c.us}:${c.them}`,t:`리베로 교대 ${nm(c.libero.lid)} → ${nm(lid2)}`}); c.court[lp]=lid2; c.libero.lid=lid2; c.lastLib=c.rallies; S.notice=[];}

function regCount(c){return c.subs.filter(s=>s.type==='reg').length}
function subCheck(out,inn,exc){
  const c=cur(); const r=[]; const notes=[];
  if(!c) return {ok:false,r:['세트를 먼저 시작하세요.'],notes};
  if(!out||!inn) return {ok:false,r:[],notes};
  const pos=posOf(c.court,out);
  if(!pos) r.push(`${nm(out)+jo(nm(out),'은는')} 지금 코트에 없습니다.`);
  if(isLib(out)) r.push('리베로는 정규 교체 대상이 아닙니다. 리베로 교대를 이용하세요.');
  if(isLib(inn)) r.push('리베로는 정규 교체로 들어갈 수 없습니다.');
  if(posOf(c.court,inn)) r.push(`${nm(inn)+jo(nm(inn),'은는')} 이미 코트에 있습니다.`);
  if(c.libero&&c.libero.replaced===inn) r.push(`${nm(inn)+jo(nm(inn),'은는')} 리베로와 교대 중입니다. 리베로를 먼저 빼야 합니다.`);
  if(S.match.barred.includes(inn)) r.push(`${nm(inn)+jo(nm(inn),'은는')} 부상 예외교체로 나가 이 경기에 다시 뛸 수 없습니다.`);
  if(isOver(c)) r.push('세트가 끝났습니다.');
  if(exc){
    notes.push('예외 교체는 정규 교체 횟수에 포함되지 않습니다.',`${nm(out)+jo(nm(out),'은는')} 이 경기에 다시 출전할 수 없습니다.`,'정규 교체가 가능한 상황이면 정규 교체가 먼저입니다.');
    return {ok:!r.length,r,notes,kind:'exc',pos};
  }
  if(regCount(c)>=S.settings.maxSubs) r.push(`이번 세트 정규 교체 ${S.settings.maxSubs}회를 모두 썼습니다. 부상이라면 예외 교체를 선택하세요.`);
  const starters=Object.values(c.starters);
  let kind='';
  if(starters.includes(out)){
    kind='A';
    if(c.starterOut[out]) r.push(`${nm(out)+jo(nm(out),'은는')} 이미 한 번 나갔다 돌아온 선발 선수입니다. 이번 세트에는 더 나갈 수 없습니다.`);
    if(starters.includes(inn)) r.push(`${nm(inn)+jo(nm(inn),'은는')} 선발 선수입니다. 선발 선수는 자기를 대신한 교체 선수와만 바뀌어 원래 자리로 돌아올 수 있습니다.`);
    else if(c.entered[inn]) r.push(`${nm(inn)+jo(nm(inn),'은는')} 이번 세트에 이미 한 번 들어왔던 교체 선수입니다. 교체 선수는 세트당 1회만 들어올 수 있습니다.`);
    if(!r.length) notes.push(`${nm(inn)+jo(nm(inn),'은는')} 앞으로 ${nm(out)}하고만 다시 바뀔 수 있습니다.`,`${nm(out)+jo(nm(out),'은는')} 이번 세트에 ${pos}번 로테이션 자리로 한 번 돌아올 수 있습니다.`);
  } else if(c.entered[out]){
    kind='B';
    if(c.entered[out]!==inn) r.push(`${nm(out)+jo(nm(out),'은는')} ${nm(c.entered[out])} 대신 들어온 교체 선수라서 ${nm(c.entered[out])}하고만 바뀔 수 있습니다.`);
    if(!r.length) notes.push(`${nm(inn)+jo(nm(inn),'이가')} 원래 자리로 복귀합니다. 이번 세트에 ${nm(inn)+jo(nm(inn),'은는')} 더 나갈 수 없고, ${nm(out)+jo(nm(out),'은는')} 다시 들어올 수 없습니다.`);
  } else {
    kind='X';
    if(pos) r.push(`${nm(out)+jo(nm(out),'은는')} 이번 세트 기록에 없는 선수입니다. 정규 교체로 처리할 수 없으니 예외 교체 여부를 확인하세요.`);
  }
  return {ok:!r.length,r,notes,kind,pos};
}
function doSub(){
  const v=S.view; const chk=subCheck(v.subOut,v.subIn,v.subExc); if(!chk.ok) return;
  const c=cur(); snap(); const out=v.subOut, inn=v.subIn, pos=chk.pos;
  c.court[pos]=inn;
  if(chk.kind==='exc'){S.match.barred.push(out); c.subs.push({type:'exc',out,inn,pos,sc:`${c.us}:${c.them}`}); c.log.push({sc:`${c.us}:${c.them}`,t:`예외 교체(부상) ${nm(out)} → ${nm(inn)} (${pos}번)`});}
  else{
    if(chk.kind==='A'){c.starterOut[out]=inn; c.entered[inn]=out;} else c.starterBack[inn]=true;
    c.subs.push({type:'reg',out,inn,pos,sc:`${c.us}:${c.them}`});
    c.log.push({sc:`${c.us}:${c.them}`,t:`교체 ${regCount(c)}/${S.settings.maxSubs}  ${nm(out)} → ${nm(inn)} (${pos}번)`});
  }
  S.notice=[{t:'info',m:`교체 완료: ${nm(out)} → ${nm(inn)} (${pos}번 자리)`}];
  v.subOut='';v.subIn='';v.subExc=false;
}
function playerStatus(id){
  const c=cur(); const m=S.match;
  if(m&&m.barred.includes(id)) return ['bad','예외 교체로 나감 · 이 경기 출전 불가'];
  if(!c) return ['mut',''];
  const pos=posOf(c.court,id);
  if(isLib(id)) return pos?['ok',`코트 ${pos}번 (${nm(c.libero&&c.libero.replaced)} 대신)`]:['mut','벤치 · 후위 선수와 교대 가능'];
  if(c.libero&&c.libero.replaced===id) return ['warn',`리베로와 교대 중 · 리베로가 나올 때 복귀`];
  const starters=Object.values(c.starters);
  if(starters.includes(id)){
    if(c.starterBack[id]) return ['warn',`선발 · 복귀 완료 (${pos}번) · 이번 세트 더 교체 불가`];
    if(c.starterOut[id]) return ['warn',`선발 · 교체 아웃 · ${nm(c.starterOut[id])} 대신 원래 자리로 1회 복귀 가능`];
    return ['ok',`선발 · ${pos}번 출전 중`];
  }
  if(c.entered[id]) return pos?['ok',`교체 투입 (${pos}번) · ${nm(c.entered[id])}하고만 교체 가능`]:['bad','교체 후 아웃 · 이번 세트 재투입 불가'];
  return ['mut','벤치 · 투입 가능'];
}

      <div class="row"><button class="btn pri" data-act="tab" data-t="roster">라인업 정하러 가기</button><button class="btn" data-act="gotransfer">데이터 옮기기</button>${lineupProblems().length?'':`<button class="btn dark" data-act="start">${sets.length+1}세트 바로 시작</button>`}</div>
      ${sets.length?`<div class="pills" style="margin-top:10px">${sets.map((s,i)=>`<span class="pill">${i+1}세트 <span class="tag">${s.us}:${s.them}</span></span>`).join('')}</div>`:''}</div>`;

    <div class="ptbtns"><button class="btn pri" data-act="pt" data-side="us" ${over?'disabled':''}>우리 득점</button><button class="btn dark" data-act="pt" data-side="them" ${over?'disabled':''}>상대 득점</button><button class="btn" data-act="undo" ${H.length?'':'disabled'} aria-label="되돌리기">↶</button></div>
    ${over?`<div class="row" style="margin-top:10px"><button class="btn pri" data-act="finish">${c.setNo}세트 ${c.us}:${c.them} 확정 → 다음 세트 준비</button></div>`:''}
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="gocheck" data-to="recv">R${c.rot+1} 리시브·서브 대형 점검 →</button><button class="btn sm" data-act="gocheck" data-to="ad">R${c.rot+1} 공수 대형 →</button><button class="btn sm" data-act="gotransfer">다른 기기로 보내기</button></div></div>`;
  h+=noticeHTML();

  // 리베로
  const libs=libIds();
  if(libs.length){
    let lb='';
    if(c.libero){
      const lp=posOf(c.court,c.libero.lid); const rr=libOutCheck();
      lb+=`<p class="small" style="margin:0 0 8px">${esc(nm(c.libero.lid))} 코트 ${lp}번 · ${esc(nm(c.libero.replaced))} 대신 · ${lp===5?'<b>다음 사이드아웃 때 4번(전위)으로 가므로 교대해야 합니다</b>':'후위 '+(lp===6?'2':'3')+'회 더 머물 수 있음'}</p>
        <div class="row"><button class="btn sm" data-act="libout" ${rr.length?'disabled':''}>리베로 아웃 (${esc(nm(c.libero.replaced))} 복귀)</button>${libs.filter(x=>x!==c.libero.lid).map(x=>`<button class="btn sm" data-act="libswap" data-id="${x}" ${rr.length?'disabled':''}>${esc(nm(x)+jo(nm(x),'으로'))} 리베로 교대</button>`).join('')}</div>

      const why=[...new Set(libs.flatMap(lid=>[5,6,1].flatMap(p=>libCheck(lid,p))))];

  const bench=S.players.filter(p=>p.role!=='L'&&!posOf(c.court,p.id)&&!(c.libero&&c.libero.replaced===p.id));
  const chk=subCheck(v.subOut,v.subIn,v.subExc);
  // 추천: 나가는 선수에 맞는 합법 후보
  let hint='';
  if(v.subOut&&!v.subExc){const legal=bench.filter(p=>subCheck(v.subOut,p.id,false).ok); hint=legal.length?`가능한 선수: ${legal.map(p=>esc(nm(p.id))).join(', ')}`:'이 선수와 정규 교체할 수 있는 선수가 없습니다.';}

    <div class="row" style="margin-top:10px"><button class="btn pri" data-act="dosub" ${chk.ok?'':'disabled'}>교체 실행</button></div></div>`;

  // 선수 상태
  h+=`<div class="card"><h3>선수 상태 <span class="sub">${c.setNo}세트 교체 규칙 기준</span></h3><div class="tblwrap"><table class="tbl"><thead><tr><th>선수</th><th>역할</th><th>상태</th></tr></thead><tbody>`+
    S.players.slice().sort((a,b)=>a.num-b.num).map(p=>{const [k,t]=playerStatus(p.id); return `<tr><td class="n">${esc(nm(p.id))}</td><td><span class="badge ${p.role==='L'?'L':''}">${ROLE[p.role]}</span></td><td class="stt ${k}">${esc(t)}</td></tr>`}).join('')+`</tbody></table></div></div>`;
  h+=`<div class="card"><h3>기록</h3><ul class="log">${c.log.slice().reverse().slice(0,40).map(l=>`<li><span class="sc">${esc(l.sc)}</span><span>${esc(l.t)}</span></li>`).join('')}</ul></div>`;
  h+=rulesSub();
  $('#pMatch').innerHTML=h;
}
function rulesSub(){return `<details class="rules"><summary>교체 규칙 요약 (FIVB 6인제)</summary><ul>
  <li>세트당 정규 교체는 최대 6회입니다. 대회 요강이 다르면 선수단 탭에서 횟수를 바꾸세요.</li>
  <li>선발 선수는 세트당 한 번 나갔다가 한 번 돌아올 수 있고, 반드시 원래 로테이션 자리로 돌아옵니다.</li>
  <li>교체 선수는 세트당 한 번만 들어올 수 있고, 자기가 대신한 선발 선수와만 다시 바뀝니다.</li>
  <li>부상으로 정규 교체가 불가능하면 리베로를 뺀 누구든 예외 교체로 들어갈 수 있습니다. 횟수에 포함되지 않고, 나간 선수는 그 경기에 다시 뛸 수 없습니다.</li>
  <li>리베로 교대는 교체가 아닙니다. 후위 선수와만, 교대했던 그 선수와만 다시 바뀌며 교대 사이에 랠리가 하나 끝나야 합니다. 리베로는 서브·블로킹·네트 위 공격을 할 수 없습니다.</li></ul></details>`}

  return h+'</div>';
}

  return i.st==='ok'||i.st==='warn'||i.st==='ex'?`${a}가 ${b}의 왼쪽 (좌우)`:`${a}가 ${b}보다 왼쪽에 있어야 합니다 · 좌우 겹침`;
}
function recvModel(){
  const v=S.view, k=v.k, serve=v.mode==='serve';
  const base=planBase(k); const L=applyLibero(base,serve); const court=L.court;
  const key=`${k}|${v.mode}`;
  const rset=new Set(S.receivers);
  const co=S.recvCustom[key]?JSON.parse(JSON.stringify(S.recvCustom[key])):(serve?autoServe():autoRecv(court,rset));
  return {k,serve,base,L,court,key,co,res:overlap(co,serve),custom:!!S.recvCustom[key]};
}
function renderRecv(dynOnly){

function adModel(){
  const v=S.view, k=v.k; const base=planBase(k); const L=applyLibero(base,false); const court=L.court;
  const spots=assignSpots(court); const defense=v.phase[0]==='d';
  const tp=tmpl(v.phase,v.sys); const key=`${k}|${v.phase}|${defense?v.sys:''}`;
  let co={};
  for(let p=1;p<=6;p++){const pl=P(court[p]); let xy=tp[spots[p]]; if(!defense&&pl&&pl.role==='S') xy=[6.0,0.8]; co[p]=xy.slice();}
  if(!defense&&v.phase==='cR'){/* 세터가 RF면 라이트 공격수 없음 */}
  if(S.adCustom[key]) co=JSON.parse(JSON.stringify(S.adCustom[key]));
  return {k,base,L,court,spots,defense,key,co,custom:!!S.adCustom[key]};
}
function adChecks(M){
  const out=[]; const c=M.court, co=M.co;
  const blockers=[], frontAtk=[];
  for(let p=1;p<=6;p++){const pl=P(c[p]); if(!pl) continue; const [x,y]=co[p]; const front=isFront(p);
    if(pl.role==='L'){
      if(y<=1.2) out.push({st:'bad',m:`${nm(c[p])}(리베로)가 네트 앞 · 리베로는 블로킹 시도도 폴트입니다`});
      else if(y<3) out.push({st:'warn',m:`${nm(c[p])}(리베로)가 프론트존 안 · 여기서 오버핸드로 올린 볼은 네트 위에서 공격할 수 없습니다 (언더핸드는 가능)`});
      continue;}
    if(front){ if(y<=1.2) blockers.push(p); if(pl.role!=='S') frontAtk.push(p); }
    else if(y<=1.2){
      if(pl.role==='S') out.push({st:'info',m:`${nm(c[p])+jo(nm(c[p]),'은는')} 후위 세터 · 토스는 가능하지만 블로킹 참여와 네트 위 볼 직접 공격(투 어택)은 폴트입니다`});
      else out.push({st:'bad',m:`${nm(c[p])+jo(nm(c[p]),'은는')} 후위 선수 · 네트 앞에서 블로킹하거나 네트 위 볼을 공격하면 폴트입니다`});
    } else if(y<3&&pl.role!=='S') out.push({st:'warn',m:`${nm(c[p])+jo(nm(c[p]),'은는')} 후위 선수 · 어택라인 안에서는 네트 위 높이 공격 불가, 후위 공격은 3m 선 뒤에서 도약`});
  }
  const setterFront=[2,3,4].some(p=>P(c[p])&&P(c[p]).role==='S');
  out.unshift({st:'info',m:`전위 공격수 ${frontAtk.length}명${setterFront?' (세터 전위 로테이션 · 후위 공격 옵션을 준비하세요)':''}`});
  let holes='',pct=0;
  if(M.defense){
    out.unshift({st:blockers.length?'ok':'bad',m:blockers.length?`블로커 ${blockers.length}명: ${blockers.map(p=>nm(c[p])).join(', ')}`:'네트 앞 전위 블로커가 없습니다'});
    const def=[1,2,3,4,5,6].filter(p=>co[p][1]>1.2).map(p=>co[p]); let n=0,h=0;
    for(let x=0.25;x<9;x+=0.5) for(let y=2.25;y<9;y+=0.5){n++; let md=1e9; for(const d of def) md=Math.min(md,Math.hypot(d[0]-x,d[1]-y)); if(md>2.5){h++; holes+=`<rect class="hole" x="${x-0.25}" y="${y-0.25}" width=".5" height=".5"/>`;}}
    pct=Math.round(h/n*100);
    out.push({st:pct>20?'warn':'ok',m:`블로커를 뺀 수비수에게서 2.5m 넘게 떨어진 빈 공간 ${pct}%`});
  } else {
    const hs=M.k!=null&&S.view.phase==='cL'?'LF':'RF';
    const hp=[2,3,4].find(p=>M.spots[p]===hs);
    const hpl=hp?P(c[hp]):null;
    if(hpl&&hpl.role==='S') out.unshift({st:'warn',m:'세터가 전위 라이트 자리입니다. 라이트 전위 공격수가 없으니 후위 공격을 쓰세요.'});
    else if(hp){const near=[1,2,3,4,5,6].filter(p=>p!==hp&&Math.hypot(co[p][0]-co[hp][0],co[p][1]-co[hp][1])<=3.2).length;
      out.unshift({st:near>=3?'ok':'warn',m:`공격수 ${nm(c[hp])} 주변 3m 안 커버 ${near}명${near>=3?'':' · 3명 이상 붙이는 것이 좋습니다'}`});}
  }
  return {out,holes,pct};
}
function renderAd(dynOnly){

  const hitSpot=v.phase==='cL'?'LF':v.phase==='cR'?'RF':'';

  paintTokens(svg,[1,2,3,4,5,6].map(p=>tokFor(M.court[p],p,M.co[p][0],M.co[p][1],badP.has(p)?'bad':(hitSpot&&M.spots[p]===hitSpot?'hit':''))));
  svg.querySelector('.dyn').innerHTML=(M.defense&&v.holes?A.holes:'')+(hitSpot?(()=>{const hp=[1,2,3,4,5,6].find(p=>M.spots[p]===hitSpot);return hp?`<circle class="ball" cx="${M.co[hp][0]+0.35}" cy="${M.co[hp][1]-0.55}" r=".2"/>`:''})():'');
  const listHTML=`<ul class="checks">${A.out.map(o=>`<li><span class="st ${o.st}">${{ok:'OK',warn:'주의',bad:'폴트 위험',info:'참고'}[o.st]}</span><span>${esc(o.m)}</span><span></span></li>`).join('')}</ul>`;
  if(dynOnly){$('#adList').innerHTML=listHTML; return;}
  let h=`<div class="card"><p class="eyebrow">로테이션 선택</p>${rotPills()}

  h+=`<div class="card"><h3>점검 결과</h3><div id="adList">${listHTML}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" data-act="adauto" ${M.custom?'':'disabled'}>기본 대형으로 되돌리기</button>${M.defense?`<button class="btn sm" data-act="toggle" data-f="holes">빈 공간 ${v.holes?'숨기기':'보기'}</button>`:''}
    <label class="checkrow small"><span><input type="checkbox" id="useLib2" data-ch="useLib" ${v.useLib?'checked':''}> 리베로 반영</span></label></div></div>`;
  const order=['LF','MF','RF','LB','CB','RB'];

    order.map(sp=>{const p=[1,2,3,4,5,6].find(q=>M.spots[q]===sp); const moved=NAT[p]===sp; return `<tr><td>${SPOTNAME[sp]}</td><td class="n">${esc(nm(M.court[p]))} <span class="badge ${isLib(M.court[p])?'L':''}">${P(M.court[p])?ROLE[P(M.court[p]).role]:''}</span></td><td class="stt ${moved?'mut':'warn'}">${p}번 ${moved?'제자리':'→ 스위치'}</td></tr>`}).join('')+`</tbody></table></div>
    <p class="small muted" style="margin:8px 0 0">서브가 맞은 뒤에는 위치를 바꿔도 됩니다. 전위·후위 구분은 그대로라서 후위 선수는 스위치해도 후위 규칙을 따릅니다.</p></div>`;
  h+=`<details class="rules"><summary>공격·수비 관련 규칙 요약</summary><ul>
    <li>후위 선수는 프론트존(어택라인 앞)에서 네트보다 높은 볼을 상대 코트로 보낼 수 없고, 블로킹에 참여할 수 없습니다.</li>
    <li>후위 공격은 어택라인을 밟지 않고 그 뒤에서 도약하면 됩니다 (착지는 앞이어도 됨).</li>

    <li>리베로가 프론트존에서 손가락 오버핸드로 올린 볼은 다른 선수가 네트 위 높이에서 공격할 수 없습니다.</li>

    `</tbody></table></div><div class="row" style="margin-top:10px"><button class="btn sm" data-act="padd">선수 추가</button></div></div>`;

  h+=`<div class="card"><h3>규칙 설정</h3><div class="fields">
    <label class="field" for="maxSubs">세트당 정규 교체 횟수<input type="number" id="maxSubs" data-ch="set" data-k="maxSubs" min="1" max="20" value="${S.settings.maxSubs}"></label>
    <label class="field" for="setPts">세트 점수<input type="number" id="setPts" data-ch="set" data-k="setPts" min="5" max="50" value="${S.settings.setPts}"></label>
    <label class="field" for="lastSet">마지막 세트 번호<input type="number" id="lastSet" data-ch="set" data-k="lastSet" min="1" max="5" value="${S.settings.lastSet}"></label>
    <label class="field" for="lastPts">마지막 세트 점수<input type="number" id="lastPts" data-ch="set" data-k="lastPts" min="5" max="50" value="${S.settings.lastPts}"></label></div>
    <p class="eyebrow" style="margin-top:14px">리베로가 대신 들어갈 역할 (후위에 오면 자동 반영)</p>
    <div class="checkrow">${['MB','OH','OPP','S','DS'].map(r=>`<label><input type="checkbox" id="lf-${r}" data-ch="libfor" data-r="${r}" ${S.liberoFor.includes(r)?'checked':''}> ${ROLE[r]}</label>`).join('')}</div>
    <div class="checkrow" style="margin-top:10px"><label><input type="checkbox" id="libServe" data-ch="libServe" ${S.settings.liberoServe?'checked':''}> 리베로 서브 허용 (FIVB는 불가 · 대회 요강이 허용할 때만)</label></div>
    <p class="small muted" style="margin:10px 0 0">학교·생활체육 대회는 교체 횟수나 리베로 규정을 따로 정하기도 합니다. 대회 요강에 맞춰 바꾸세요.</p></div>`;
  h+=transferCard();
  $('#pRoster').innerHTML=h;
}

/* ---------- 데이터 옮기기 (내보내기·가져오기) ---------- */
const XS={msg:null,code:'',pending:null,paste:false};
const XKEYS=['players','lineup','liberoFor','receivers','settings','nextServe','match','recvCustom','adCustom'];
function exportObj(){const d={}; XKEYS.forEach(k=>d[k]=S[k]); return {app:'benchboard',v:1,exportedAt:new Date().toISOString(),data:d};}
function exportText(){return JSON.stringify(exportObj());}
function stamp(){const t=new Date(),p=n=>String(n).padStart(2,'0'); return `${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}-${p(t.getHours())}${p(t.getMinutes())}`;}
function summarize(d){
  const m=d.match; const sets=m&&m.sets?m.sets.length:0; const c=m&&m.cur;
  return `선수 ${d.players.length}명`+(sets?` · 끝난 세트 ${sets}개`:'')+(c?` · ${c.setNo}세트 진행 중 ${c.us}:${c.them}`:'')+(m?'':' · 경기 기록 없음');
}
function parseImport(txt){
  let o; try{o=JSON.parse(String(txt).trim());}catch(e){return {err:'읽을 수 없는 내용입니다. 내보내기로 만든 코드 전체를 빠짐없이 붙여 넣으세요.'};}
  if(!o||o.app!=='benchboard'||!o.data||!Array.isArray(o.data.players)) return {err:'벤치보드에서 내보낸 데이터가 아닙니다.'};
  return {obj:o};
}
function transferCard(){
  const p=XS.pending;
  let h=`<div class="card" id="transfer"><h3>데이터 옮기기 <span class="sub">다른 기기에서 같은 선수단과 경기 기록 보기</span></h3>
    <p class="small muted" style="margin:0 0 10px">이 기기에서 내보낸 뒤, 다른 기기의 벤치보드에서 가져오기 하세요. 내용은 서버에 올라가지 않고 보내는 사람이 고른 곳(카카오톡, 파일)으로만 갑니다.</p>
    <p class="eyebrow">내보내기 · ${esc(summarize(exportObj().data))}</p>
    <div class="row"><button class="btn pri" data-act="xshare">공유하기</button><button class="btn" data-act="xcopy">코드 복사</button><button class="btn" data-act="xfile">파일로 저장</button></div>`;
  if(XS.code) h+=`<textarea id="xcode" readonly rows="3" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--soft)">${esc(XS.code)}</textarea><p class="small muted" style="margin:4px 0 0">자동 복사가 안 되면 위 칸을 길게 눌러 전체 선택 후 복사하세요.</p>`;
  h+=`<p class="eyebrow" style="margin-top:16px">가져오기</p>
    <div class="row"><label class="btn" for="xin" style="display:inline-block">파일 열기</label><input type="file" id="xin" data-ch="xfilein" accept=".json,application/json,text/plain" style="position:absolute;width:1px;height:1px;opacity:0"><button class="btn" data-act="xpaste">코드 붙여넣기</button></div>`;
  if(XS.paste&&!p) h+=`<textarea id="xpastebox" rows="4" placeholder="받은 코드를 여기에 붙여 넣으세요" style="width:100%;margin-top:8px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)"></textarea><div class="row" style="margin-top:6px"><button class="btn sm pri" data-act="xcheck">내용 확인</button></div>`;
  if(p){const d=p.data; h+=`<div class="notice info" style="margin-top:10px"><b>가져올 데이터</b><span>${esc(summarize(d))} · ${esc(new Date(p.exportedAt).toLocaleString('ko-KR'))}에 내보냄</span>
      <span class="small">지금 이 기기의 데이터는 바뀝니다. 필요하면 먼저 이 기기 데이터를 내보내 두세요.</span>
      <div class="row" style="margin-top:6px"><button class="btn sm pri" data-act="ximport" data-m="all">전체 가져오기 (경기 기록 포함)</button><button class="btn sm" data-act="ximport" data-m="roster">선수단·라인업만</button><button class="btn sm" data-act="xcancel">취소</button></div></div>`;}
  if(XS.msg) h+=`<div class="notice ${XS.msg.t}" style="margin-top:10px">${esc(XS.msg.m)}</div>`;
  return h+`</div>`;
}
function xcopyFallback(txt){XS.code=txt;}
function xsetPending(txt){const r=parseImport(txt); if(r.err){XS.msg={t:'bad',m:r.err}; XS.pending=null;} else {XS.pending=r.obj; XS.msg=null; XS.paste=false;}}

/* ---------- 이벤트 ---------- */
const ACT={
  tab:d=>{S.view.tab=d.t; S.view.resetAsk=false;},
  start:()=>startSet(),
  pt:d=>point(d.side),
  undo:()=>undo(),
  finish:()=>finishSet(),
  gocheck:d=>{S.view.k=curRot(); S.view.tab=d.to; if(d.to==='recv'){const c=cur(); S.view.mode=c&&c.serving==='us'?'serve':'recv';}},
  libin:d=>libIn(d.id,+d.pos),
  libout:()=>libOut(),
  libswap:d=>libSwap(d.id),
  dosub:()=>doSub(),
  rot:d=>{S.view.k=+d.k},
  mode:d=>{S.view.mode=d.m},
  phase:d=>{S.view.phase=d.p},
  sys:d=>{S.view.sys=d.s},
  toggle:d=>{S.view[d.f]=!S.view[d.f]},
  recvr:d=>{const i=S.receivers.indexOf(d.id); if(i>=0) S.receivers.splice(i,1); else S.receivers.push(d.id); delete S.recvCustom[`${S.view.k}|recv`];},
  recvauto:()=>{delete S.recvCustom[`${S.view.k}|${S.view.mode}`]},
  adauto:()=>{const M=adModel(); delete S.adCustom[M.key]},
  padd:()=>{const used=S.players.map(p=>+p.num); let n=1; while(used.includes(n)) n++; S.players.push({id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),num:n,name:'새 선수',role:'OH'}); S.example=false;},
  pdel:d=>{S.players=S.players.filter(p=>p.id!==d.id); for(const k in S.lineup) if(S.lineup[k]===d.id) S.lineup[k]=''; S.receivers=S.receivers.filter(x=>x!==d.id); S.example=false;},
  clearex:()=>{S.example=false;},
  resetask:()=>{S.view.resetAsk=true},
  resetno:()=>{S.view.resetAsk=false},
  reset:()=>{S.match=null; S.notice=[]; H=[]; S.view.resetAsk=false; S.nextServe='them';},
  xcopy:()=>{const txt=exportText(); XS.msg={t:'info',m:'코드를 복사했습니다. 카카오톡 등에 붙여 넣어 보내세요.'}; XS.code='';
    try{navigator.clipboard.writeText(txt).catch(()=>{XS.code=txt; XS.msg={t:'warn',m:'자동 복사가 막혀 있습니다. 아래 칸의 코드를 직접 복사하세요.'}; render();});}catch(e){XS.code=txt; XS.msg={t:'warn',m:'자동 복사가 막혀 있습니다. 아래 칸의 코드를 직접 복사하세요.'};}},
  xfile:()=>{const txt=exportText(); const name=`벤치보드-${stamp()}.json`;
    try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000);
      XS.msg={t:'info',m:`${name} 파일을 저장했습니다. 저장되지 않았다면 '코드 복사'를 쓰세요.`};}catch(e){XS.code=txt; XS.msg={t:'warn',m:'이 화면에서는 파일 저장이 안 됩니다. 아래 코드를 복사하세요.'};}},
  xshare:()=>{const txt=exportText(); const name=`벤치보드-${stamp()}.json`;
    if(!navigator.share){XS.code=txt; XS.msg={t:'warn',m:'이 기기에서는 공유하기를 쓸 수 없습니다. 코드 복사나 파일 저장을 쓰세요.'}; return;}
    let data={title:'벤치보드 데이터',text:txt};
    try{const f=new File([txt],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})) data={title:'벤치보드 데이터',files:[f]};}catch(e){}
    navigator.share(data).catch(err=>{if(err&&err.name==='AbortError') return; XS.code=txt; XS.msg={t:'warn',m:'공유하기가 열리지 않았습니다. 아래 코드를 복사해 보내세요.'}; render();});},
  gotransfer:()=>{S.view.tab='roster'; setTimeout(()=>{const el=$('#transfer'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},50);},
  xpaste:()=>{XS.paste=true; XS.pending=null; XS.msg=null; setTimeout(()=>{const t=$('#xpastebox'); if(t) t.focus();},0);},
  xcheck:()=>{const t=$('#xpastebox'); xsetPending(t?t.value:'');},
  xcancel:()=>{XS.pending=null; XS.msg=null;},
  ximport:d=>{const p=XS.pending; if(!p) return; const src=p.data;
    if(d.m==='all'){XKEYS.forEach(k=>{if(src[k]!==undefined) S[k]=src[k];}); H=[]; S.notice=[];}
    else{['players','lineup','liberoFor','receivers','settings'].forEach(k=>{if(src[k]!==undefined) S[k]=src[k];});
      if(S.match&&S.match.cur){/* 진행 중 세트의 선수가 사라지지 않도록 확인 */ const ids=new Set(S.players.map(x=>x.id)); if(Object.values(S.match.cur.court).some(id=>!ids.has(id))){S.match=null; H=[];}}}
    S.settings=Object.assign(def().settings,S.settings||{}); S.example=false; S.recvCustom=S.recvCustom||{}; S.adCustom=S.adCustom||{};
    XS.pending=null; XS.msg={t:'info',m:d.m==='all'?'가져왔습니다. 경기 화면에서 이어서 진행할 수 있습니다.':'선수단과 라인업을 가져왔습니다.'};}
};
const CH={
  subOut:t=>{S.view.subOut=t.value; if(S.view.subIn&&!subCheck(t.value,S.view.subIn,S.view.subExc).ok) S.view.subIn='';},
  subIn:t=>{S.view.subIn=t.value},
  subExc:t=>{S.view.subExc=t.checked},
  useLib:t=>{S.view.useLib=t.checked},
  lineup:t=>{S.lineup[t.dataset.pos]=t.value; S.example=false;},
  nextServe:t=>{S.nextServe=t.value},
  pnum:t=>{const p=P(t.dataset.id); if(p){p.num=parseInt(t.value,10)||0; S.example=false;}},
  pname:t=>{const p=P(t.dataset.id); if(p){p.name=t.value.trim()||'이름 없음'; S.example=false;}},
  prole:t=>{const p=P(t.dataset.id); if(p){p.role=t.value; S.example=false; if(t.value==='L') for(const k in S.lineup) if(S.lineup[k]===p.id) S.lineup[k]='';}},
  precv:t=>{const id=t.dataset.id; S.receivers=S.receivers.filter(x=>x!==id); if(t.checked) S.receivers.push(id); S.recvCustom={};},
  set:t=>{const v=parseInt(t.value,10); if(v>0) S.settings[t.dataset.k]=v;},
  libfor:t=>{const r=t.dataset.r; S.liberoFor=S.liberoFor.filter(x=>x!==r); if(t.checked) S.liberoFor.push(r); S.recvCustom={};},
  libServe:t=>{S.settings.liberoServe=t.checked},
  xfilein:t=>{const f=t.files&&t.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{xsetPending(rd.result); render(); const el=$('#transfer'); if(el) el.scrollIntoView({block:'nearest'});}; rd.onerror=()=>{XS.msg={t:'bad',m:'파일을 읽지 못했습니다.'}; render();}; rd.readAsText(f); t.value='';}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const f=ACT[b.dataset.act]; if(!f) return; f(b.dataset,b); save(); render();});
document.addEventListener('change',e=>{const t=e.target; const f=t.dataset&&CH[t.dataset.ch]; if(!f) return; f(t); save(); render();});

/* 드래그 */
function toSvg(svg,e){const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse());}
['#svgRecv','#svgAd'].forEach(sel=>{
  const svg=$(sel);
  svg.addEventListener('pointerdown',e=>{const g=e.target.closest('.tok'); if(!g) return; drag={svg,key:+g.dataset.key,id:e.pointerId}; svg.setPointerCapture(e.pointerId); svg.classList.add('dragging'); e.preventDefault();});
  svg.addEventListener('pointermove',e=>{
    if(!drag||drag.svg!==svg) return; const p=toSvg(svg,e);
    const x=r1(Math.min(10,Math.max(-1,p.x))), y=r1(Math.min(10.8,Math.max(-0.6,p.y)));
    if(sel==='#svgRecv'){const M=recvModel(); M.co[drag.key]=[x,y]; S.recvCustom[M.key]=M.co; renderRecv(true);}
    else{const M=adModel(); M.co[drag.key]=[x,y]; S.adCustom[M.key]=M.co; renderAd(true);}
  });
  const end=()=>{if(!drag) return; drag=null; svg.classList.remove('dragging'); save(); render();};
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
});

initCourts(); render();
})();
</script>
<script>
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
